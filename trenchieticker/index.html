<!DOCTYPE html> <!--man background, retire conversion, saves 1 2 3 clear, show tinperclick on tinbutton, achievements "EvE, bad ending, brave man", runnermen times and plus, hidden mods-->
<html>
  <head>
    <title>Trenchie Ticker</title>
    <style>
      .box {
        position:fixed;
        min-height:20px;
        min-width:20px;
        border:2px solid black;
        background-color:#74a44b;
        padding:0;
        display:flex;
        flex-direction:column;
      }
      #clickbox {
        top:0;
        right:255px;
        left:0;
        width:calc(100%-255px);
        height:255px;
        background-color:#a3876f !important;
      }
      body.flippedx #clickbox {
        right:0;
        left:255px;
      }
      body.flippedy #clickbox {
        top:auto;
        bottom:0;
      }
        #click {
          margin-top:auto;
          width:100%;
          height:51px;
          justify-content:flex-end;
          order:66;
          background:url('sprites/ourtrench.png');
          background-repeat:repeat-x;
        }
        #theirtrench {
          margin-bottom:auto;
          width:100%;
          height:51px;
          justify-content:flex-start;
          order:1;
          background:url('sprites/theirtrench.png');
          background-repeat:repeat-x;
        }
      #elsebox {
        top:255px;
        right:255px;
        bottom:0;
        left:0;
        width:calc(100%-255px);
        height:calc(100%-255px);
      }
      body.flippedx #elsebox {
        right:0;
        left:255px;
      }
      body.flippedy #elsebox {
        bottom:255px;
        top:0;
      }
        #basicsview {
          margin-bottom: auto;
        }
        #menuview {
          margin-top: auto;
        }
          .textbox {
            border:1px solid black;
            margin:2px;
          }
        #retire {
          margin-top:auto;
          width:204px;
          height:102px;
          background:url('sprites/warbond.png');
          background-repeat:no-repeat;
          background-size:cover;
          justify-content:flex-end;
          order:66;
        }
      #modbox {
        top:0;
        bottom:0;
        right:0;
        width:255px;
        height:100%;
        overflow-y:auto;
        justify-content:flex-start;
        background-color:transparent;
      }
      body.flippedx #modbox {
        right:auto;
        left:0px;
      }
      .modbutton {
        width:calc(100%-51px);
        height:51px;
        min-height:51px;
        margin:10px;
        border:1px solid black;
        overflow:visible;
        flex:1;
      }
      .orbuttons {
        display:flex;
        width:100%;
        flex-direction:row;
      }
      .fakemodbutton {
        background-color:transparent !important;
        border:0 !important;
        min-height:51px;
      }
      #flavorbox {
        position:fixed;
        display:none;
        pointer-events:none;
        background: rgba(0, 0, 0, 0.667);
        color:white;
        border:1px solid white;
        border-radius:1px;
        z-index:999;
      }
    </style>
  </head>
  <body>
    <div id="clickbox" class="box">
      <div id="theirtrench"></div>
      <button id="click" flavortext="Click!"></button>
    </div>
    <div id="modbox" class="box"> <!--could be fancier with this code, display cost/boost in text, 6 more for buyable-->
      <button class="modbutton" modcost="25" modboost="1" flavortext="Can't tangle no hair! (+1 Tin)">Clean Shave<br>[25 Tin]</button>
      <button class="modbutton" modcost="100" modboost="1" flavortext="No reason, why? (+1 Tin)">Spiked Helmets<br>[100 Tin]</button>
      <div class="orbuttons">
        <button class="modbutton" modcost="25" modboost="0" flavortext="Do we have enough paint?.. What do you mean dye? (+0 Tin)">Patriotic Dye<br>[25 Tin]</button>
        <button class="modbutton" modcost="100" modboost="1" flavortext="'I didn't see you at practice today.' 'Thank you sir.' (+1 Tin)">Camoflage<br>[100 Tin]</button>
      </div>
      <button class="modbutton" modcost="1000" modboost="2" flavortext="The perfect counter to those flares. (+2 Tin)">Eye Drying Treatment<br>[1000 Tin]</button>
      <div class="orbuttons">
        <button class="modbutton" modcost="50" modboost="0" flavortext="For cat food, what else? (+0 Tin)">Cat Food Cans<br>[50 Tin]</button>
        <button class="modbutton" modcost="-25" modboost="0" flavortext="Got a refund. (+0 Tin)">Rats<br>[-25 Tin]</button>
      </div>
      <button class="modbutton" modcost="1500" modboost="2" flavortext="They die as often as people. (+2 Tin)">Trench Cats<br>[1500 Tin]</button>
      <div class="orbuttons">
        <button class="modbutton" flavortext="The worst thing is to hit an ally. (+1 Tin)">Gun Safety Training<br>[2000 Tin]</button>
        <button class="modbutton" flavortext="The worst thing is to miss a shot. (+1 Tin)">Aim Training<br>[1000 Tin]</button>
      </div>
      <button class="modbutton" flavortext="Resilient fucks already got used to the poison. (+2 Tin)">Acid Resistance Training<br>[3000 Tin]</button>
      <button class="modbutton" flavortext="For the snow to come. (+0 Tin)">Salt<br>[2000 Tin]</button>
      <div class="orbuttons">
        <button class="modbutton" flavortext="To make them happy. (+2000 Tin)">Lobotomies<br>[5000 Tin]</button>
        <button class="modbutton" flavortext="To make them happy. (+200 Tin)">Fireworks<br>[5000 Tin]</button>
      </div>
      <!-- do smth here
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="modbutton" flavortext="+1 Gazillion Tin">The Greatest War<br>[1914916 Tin]</button>
      <button class="modbutton" flavortext="I don't need this at all.">Abilify<br>[2 Dollars]</button>
      -->
    </div>
    <div id="elsebox" class="box">
      <div id="basicsview">
        <p class="textbox">Tin:<span id="tintext">0</span></p>
        <p class="textbox">Days:0</p>
        <button id="retire" flavortext="Convert upgrades to days."></button>
      </div>
      <div id="menuview">
        <h3>Layout</h3>
        <button id="flipx">Flip Horizontal</button>
        <button id="flipy">Flip Vertical</button>
        <h3>Saves</h3>
      </div>
    </div>
    <div id="flavorbox"></div>
    <script>
      let tin = 0;
      let tinPerClick = 1;
      const clickButton = document.getElementById('click');
      const tinText = document.getElementById('tintext');
      const flipX = document.getElementById('flipx');
      const flipY = document.getElementById('flipy');
      const flavorBox = document.getElementById('flavorbox');

      clickButton.addEventListener('click', () => {
        tin += tinPerClick;
        tinText.textContent = tin;

        tinText.style.color = "white";
        setTimeout(() => {
          tinText.style.color = ""; //return
        }, 100);
      });
      flipX.addEventListener('click', () => {
        document.body.classList.toggle('flippedx')
      });
      flipY.addEventListener('click', () => {
        document.body.classList.toggle('flippedy')
      });

      const allButtons = document.querySelectorAll('button');

      allButtons.forEach(button => {
        if (button.classList.contains('modbutton')) {
          button.addEventListener('click', () => {
            const cost = parseInt(button.getAttribute('modcost')) || 0; //turn string to integer
            const boost = parseInt(button.getAttribute('modboost')) || 0;
            let prevButton = button.previousElementSibling;
            while (prevButton && !prevButton.classList.contains('modbutton')) {
              prevButton = prevButton.previousElementSibling;
            }
            if (prevButton && prevButton.style.display !== 'none') {
              return;
            }
            if (tin >= cost) {
              tin -= cost;
              tinPerClick += boost;
              tinText.textContent = tin;
              const parentContainer = button.closest('.orbuttons'); //cant buy second orbutton, buying doesnt cost tin
              if (parentContainer) {
                const siblingButtons = parentContainer.querySelectorAll('.modbutton');
                siblingButtons.forEach(sib => {
                  sib.style.display = 'none';
                })
              } else {
                button.style.display = 'none';
              }
            }
          });
        }
        button.addEventListener('mouseenter', () => {
          const text = button.getAttribute('flavortext');
          if (text) {
            flavorBox.textContent = text;
            flavorBox.style.display = 'block';
          }
        });
        button.addEventListener('mousemove', (e) => {
          flavorBox.style.left = (e.clientX + 12) + 'px';
          flavorBox.style.top = (e.clientY + 12) + 'px';
        })
        button.addEventListener('mouseleave', () => {
          flavorBox.textContent = '';
          flavorBox.style.display = 'none';
        });
      });
    </script>
  </body>
</html>
